<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery – Estrogen Elite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gallery.css">
</head>

<body>

  <header class="solid">
    <a class="logo" href="index.html">Estrogen Elite</a>
    <nav aria-label="Main">
      <a href="index.html#roster">Roster</a>
      <a href="index.html#about">About</a>
      <a href="index.html#matches">Matches</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </header>
  <div class="flag" aria-hidden="true"></div>

  <main>
    <div class="gallery-head">
      <div class="wrap">
        <h2><span>Out of game</span> <span>hangouts</span></h2>
        <p>Meetups, snacks, and the occasional round that is not Counter-Strike.</p>
      </div>
    </div>
    <div class="flag thin" aria-hidden="true"></div>

    <section class="gallery">
      <div class="wrap">
        <!--
        To add a photo: save it in image/gallery/ using the file name of a tile below
        (hangout1.jpg to hangout12.jpg) and edit that tile's caption.
        To add more tiles, copy a whole <figure> block and change the number and file name.
      -->
        <div class="board">
          <div class="col">
            <figure class="tile blue tall">
              <button type="button" aria-label="Open photo 1"><span class="ph" aria-hidden="true">1</span><img
                  src="image/gallery/hangout1.png" alt="Team hangout photo 1" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 1</figcaption>
            </figure>
            <figure class="tile pink square">
              <button type="button" aria-label="Open photo 2"><span class="ph" aria-hidden="true">2</span><img
                  src="image/gallery/hangout2.png" alt="Team hangout photo 2" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 2</figcaption>
            </figure>
            <figure class="tile white wide">
              <button type="button" aria-label="Open photo 3"><span class="ph" aria-hidden="true">3</span><img
                  src="image/gallery/hangout3.png" alt="Team hangout photo 3" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 3</figcaption>
            </figure>
          </div>
          <div class="col">
            <figure class="tile pink square">
              <button type="button" aria-label="Open photo 4"><span class="ph" aria-hidden="true">4</span><img
                  src="image/gallery/hangout4.png" alt="Team hangout photo 4" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 4</figcaption>
            </figure>
            <figure class="tile white tall">
              <button type="button" aria-label="Open photo 5"><span class="ph" aria-hidden="true">5</span><img
                  src="image/gallery/hangout5.png" alt="Team hangout photo 5" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 5</figcaption>
            </figure>
            <figure class="tile blue wide">
              <button type="button" aria-label="Open photo 6"><span class="ph" aria-hidden="true">6</span><img
                  src="image/gallery/hangout6.png" alt="Team hangout photo 6" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 6</figcaption>
            </figure>
          </div>
          <div class="col">
            <figure class="tile white wide">
              <button type="button" aria-label="Open photo 7"><span class="ph" aria-hidden="true">7</span><img
                  src="image/gallery/hangout7.png" alt="Team hangout photo 7" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 7</figcaption>
            </figure>
            <figure class="tile blue tall">
              <button type="button" aria-label="Open photo 8"><span class="ph" aria-hidden="true">8</span><img
                  src="image/gallery/hangout8.png" alt="Team hangout photo 8" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 8</figcaption>
            </figure>
            <figure class="tile pink square">
              <button type="button" aria-label="Open photo 9"><span class="ph" aria-hidden="true">9</span><img
                  src="image/gallery/hangout9.png" alt="Team hangout photo 9" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 9</figcaption>
            </figure>
          </div>
          <div class="col">
            <figure class="tile blue square">
              <button type="button" aria-label="Open photo 10"><span class="ph" aria-hidden="true">10</span><img
                  src="image/gallery/hangout10.png" alt="Team hangout photo 10" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 10</figcaption>
            </figure>
            <figure class="tile pink wide">
              <button type="button" aria-label="Open photo 11"><span class="ph" aria-hidden="true">11</span><img
                  src="image/gallery/hangout11.png" alt="Team hangout photo 11" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 11</figcaption>
            </figure>
            <figure class="tile white tall">
              <button type="button" aria-label="Open photo 12"><span class="ph" aria-hidden="true">12</span><img
                  src="image/gallery/hangout12.png" alt="Team hangout photo 12" loading="lazy"
                  onerror="this.remove()"></button>
              <figcaption>Caption 12</figcaption>
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="flag" aria-hidden="true"></div>
  <footer>
    <p>&copy; 2026 Estrogen Elite. Find us on <a href="https://www.faceit.com/en/teams/6bc1301d-801a-49da-abb9-5d9783f76c84">Faceit</a>.</p>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button type="button" id="close" aria-label="Close">&times;</button>
    <img id="big" src="" alt="">
    <p id="cap"></p>
  </dialog>

  <script>
    const box = document.getElementById('lightbox');
    document.querySelectorAll('.tile').forEach(t => {
      t.querySelector('button').addEventListener('click', () => {
        const img = t.querySelector('img');
        if (!img) return;
        document.getElementById('big').src = img.src;
        document.getElementById('big').alt = img.alt;
        document.getElementById('cap').textContent = t.querySelector('figcaption').textContent;
        box.showModal();
      });
    });
    document.getElementById('close').addEventListener('click', () => box.close());
    box.addEventListener('click', e => { if (e.target === box) box.close(); });
  </script>
</body>

</html>
